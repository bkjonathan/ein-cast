name: Idea or feature request
description: Suggest something EinCast could do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        EinCast tries to stay **simple**: no accounts, no cloud, no analytics, no plugin system. Ideas that fit that are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution. "My grandmother's TV cannot…" is better than "add a button for…".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: dropdown
    id: simple
    attributes:
      label: Does this keep EinCast simple?
      description: Be honest; it helps us decide.
      options:
        - "Yes: it needs no account, no cloud and no new setting most people must understand"
        - "Mostly: it adds one setting or screen"
        - "No: it needs something EinCast avoids (say what below)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today, or what did you try?
