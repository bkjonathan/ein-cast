# Runs the full check on the two platforms EinCast ships for. scripts/check-cross.sh
# proves the code compiles for the other OS; this proves it behaves on each one.
# Not triggered by pushes or pull requests: release.yml calls it when a v* tag is
# pushed, and it can be run by hand from the Actions tab.
name: ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash # Git Bash on Windows, so the scripts below run unchanged

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck and tests
        working-directory: frontend
        run: |
          npm run typecheck
          npm test

      # The embedded frontend must exist before Go can compile the main package.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Go vet
        run: go vet ./...

      - name: Dependency rules
        run: scripts/check-deps.sh

      - name: Network rules (docs/PRIVACY.md stays true)
        run: scripts/check-network.sh

      # The race detector needs cgo; macOS has it, and it is the platform where
      # the concurrency code is exercised hardest. Windows runs the same tests
      # without it.
      - name: Go tests (macOS, with the race detector)
        if: runner.os == 'macOS'
        run: go test -race -count=1 ./...

      # The timeout turns a hung test into a quick, readable failure instead of
      # ten minutes of silence. Every failing line goes into ONE annotation (up to
      # 80 lines; %0A is how an annotation spells a newline, and a literal % must
      # be %25) so the run's summary page shows the whole list, not just the first
      # few: GitHub caps how many separate annotations a step may have.
      - name: Go tests (Windows)
        if: runner.os == 'Windows'
        run: |
          status=0
          go test -count=1 -timeout 4m ./... 2>&1 | tee test.log || status=$?
          failures=$(
            { grep -E '^[[:space:]]*(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+' test.log || true; } |
              head -80 | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'
          )
          if [ -n "${failures}" ]; then
            echo "::error title=Windows test failures::${failures}"
          fi
          exit "${status}"

      - name: Cross-compile check
        run: scripts/check-cross.sh

      - name: Wails build
        run: wails build -ldflags "-X main.version=ci"
