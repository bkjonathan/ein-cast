# Builds the desktop apps and publishes them as a GitHub release.
# Push a tag like v1.0.2 and this creates the release (if it does not exist yet)
# and uploads:
#   eincast-<version>-macos-universal.zip      (eincast.app, Intel + Apple Silicon)
#   eincast-<version>-windows-amd64-installer.exe
#   eincast-<version>-windows-amd64.exe        (portable)
#   SHA256SUMS.txt                             (checksums of the three files above)
# The app's update check reads SHA256SUMS.txt to show each file's checksum, so keep
# that name. The builds are unsigned for now; see docs/ROADMAP.md (v1.0) for signing.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets to it

jobs:
  # Created once, before the builds, so the two platform jobs never race to
  # create it. A release someone already published by hand is left as it is.
  create-release:
    runs-on: ubuntu-latest
    steps:
      # The whole history, because the notes are the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac # v1.2.0-rc1 is a pre-release
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "EinCast ${TAG#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            platform: darwin/universal
          - name: windows
            os: windows-latest
            platform: windows/amd64
    defaults:
      run:
        shell: bash # Git Bash on Windows, so the steps below run unchanged

    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # The tag is the single source of truth for the version. The installer and
      # Info.plist need a plain x.y.z, so a pre-release suffix (-rc1) is dropped there.
      - name: Resolve version
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRODUCT_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"

      - name: Stamp product version
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wails.json", "utf8"));
            cfg.info.productVersion = process.env.PRODUCT_VERSION;
            fs.writeFileSync("wails.json", JSON.stringify(cfg, null, 2) + "\n");
          '

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: command -v makensis >/dev/null || choco install nsis -y --no-progress

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform ${{ matrix.platform }} -ldflags "-X main.version=$VERSION"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          # makensis may have just been installed; make it visible to wails.
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -clean -platform ${{ matrix.platform }} -nsis -ldflags "-X main.version=$VERSION"

      # ditto keeps the bundle's symlinks and permissions; plain zip would corrupt the .app.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --sequesterRsrc --keepParent build/bin/eincast.app \
            "dist/eincast-$VERSION-macos-universal.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp build/bin/eincast.exe "dist/eincast-$VERSION-windows-amd64.exe"
          cp build/bin/*-installer.exe "dist/eincast-$VERSION-windows-amd64-installer.exe"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Published last, once every file it covers is on the release. A failed build
  # leaves this job skipped, so the checksums never describe a partial release.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dl
          cd dl
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'eincast-*'
          # "<hash>  <name>" per line, which `shasum -a 256 -c` and the app both read.
          sha256sum eincast-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # macOS zip, Windows installer, Windows portable: a missing one means a build did not upload.
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
