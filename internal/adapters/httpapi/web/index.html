<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EinCast</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img class="logo" src="/static/icon.png" alt="" width="48" height="48">
      <div>
        <h1 id="server-name">EinCast</h1>
        <p class="tagline">Your home media, on every screen.</p>
      </div>
    </div>
    <a class="button" id="playlist-link" href="/playlist.m3u" download="eincast.m3u">Playlist for VLC / Infuse</a>
  </header>

  <section id="stage" class="stage" hidden>
    <p id="now-playing" class="now-playing"></p>
    <video id="video" controls playsinline hidden></video>
    <audio id="audio" controls hidden></audio>
    <img id="image" alt="" hidden>
    <p id="resume" class="hint" hidden><span id="resume-text"></span> <button type="button" id="restart" class="linkbutton">Start over</button></p>
    <p id="hint" class="hint" hidden></p>
    <p><a id="direct-link" class="link" href="#" hidden>Open the file directly</a></p>
  </section>

  <main>
    <input id="search" type="search" placeholder="Search" aria-label="Search library" autocomplete="off">
    <p id="status" class="status" role="status">Loading…</p>
    <div id="groups"></div>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
